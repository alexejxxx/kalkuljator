<!DOCTYPE html>
<html ru>
<head>
    <meta charset="UTF-8">
    <title>Авто-Калькулятор</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #display {
            width: 100%;
            height: 40px;
            background-color: #444;
            margin-bottom: 10px;
            text-align: right;
            padding: 5px;
            box-sizing: border-box;
            font-size: 24px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            background-color: #555;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #777;
        }
        button.equal {
            background-color: #e65c00;
        }
        button.equal:hover {
            background-color: #ff8533;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div id="display">0</div>
    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')">/</button>
        <button onclick="appendValue('*')">*</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('-')">-</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('+')">+</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    let currentExpression = '';
    let clickSound = document.getElementById('clickSound');

    function appendValue(value) {
        if (currentExpression === '0') currentExpression = '';
        currentExpression += value;
        updateDisplay();
    }

    function clearDisplay() {
        currentExpression = '0';
        updateDisplay();
    }

    function deleteLast() {
        currentExpression = currentExpression.slice(0, -1) || '0';
        updateDisplay();
    }

    function calculate() {
        try {
            currentExpression = eval(currentExpression).toString();
            updateDisplay();
            new Audio('supra-power_ztXHrrQE.mp3').play()
        } catch (error) {
            display.innerText = 'Ошибка';
            currentExpression = '';
        }
    }

    function updateDisplay() {
        display.innerText = currentExpression;
    }
</script>

</body>
</html>
